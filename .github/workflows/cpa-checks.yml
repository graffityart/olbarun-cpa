name: CPA checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settlement_test
          POSTGRES_PASSWORD: settlement_test_password
          POSTGRES_DB: settlement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement_test -d settlement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:cpa
      - run: npm run test:settlements
      - name: Run settlement concurrency tests against disposable PostgreSQL
        env:
          CI: 'true'
          NODE_ENV: test
          SETTLEMENT_TEST_DATABASE_URL: postgresql://settlement_test:settlement_test_password@localhost:5432/settlement_ci
          SETTLEMENT_TEST_DB_CONFIRM: disposable
        run: npm run test:settlement-concurrency
      - run: npm run test:posting-review
