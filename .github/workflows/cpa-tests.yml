name: CPA checks
on:
  push:
    branches: [main]
    paths:
      - "lib/cpa/**"
      - "app/api/admin/conversions/**"
      - "app/admin/conversions/**"
      - "app/api/conversions/**"
      - "app/api/admin/campaigns/**"
      - "app/api/admin/advertisers/**"
      - "app/api/advertiser/**"
      - "app/api/auth/advertiser-signup/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cpa-tests.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/cpa/**"
      - "app/api/admin/conversions/**"
      - "app/admin/conversions/**"
      - "app/api/admin/campaigns/**"
      - "app/api/admin/advertisers/**"
      - "app/api/advertiser/**"
      - "app/api/auth/advertiser-signup/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cpa-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run test:cpa
      - run: npm run typecheck
