name: CPA regression and TypeScript
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpa-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settlement_test
          POSTGRES_PASSWORD: settlement_test_password
          POSTGRES_DB: settlement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement_test -d settlement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run regression tests
        id: tests
        env:
          NODE_ENV: test
          SETTLEMENT_TEST_DATABASE_URL: postgresql://settlement_test:settlement_test_password@localhost:5432/settlement_ci
          SETTLEMENT_TEST_DB_CONFIRM: disposable
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee cpa-test-results.log
      - name: Check TypeScript
        id: types
        if: always()
        run: npm run typecheck
      - name: Publish check summary
        if: always()
        run: |
          echo "## CPA automated checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regression suite: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript: ${{ steps.types.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cpa-test-results.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Test suite summary | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
            for metric in tests pass fail skipped cancelled todo; do
              total=$(awk -v metric="$metric" '$1=="#" && $2==metric && $3 ~ /^[0-9]+$/ {sum+=$3;found=1} END {if(found) print sum; else print "not reported"}' cpa-test-results.log)
              echo "| $metric | $total |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo "- Note: database concurrency tests require a disposable test database." >> "$GITHUB_STEP_SUMMARY"
