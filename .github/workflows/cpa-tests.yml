name: CPA checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpa-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run regression tests
        id: tests
        run: npm run test:all
      - name: Check TypeScript
        id: types
        if: always()
        run: npm run typecheck
      - name: Publish check summary
        if: always()
        run: |
          echo "## CPA automated checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regression suite: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript: ${{ steps.types.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: database concurrency tests require a disposable test database." >> "$GITHUB_STEP_SUMMARY"
