name: Settlement tests
on:
  push:
    branches: [main]
    paths:
      - "lib/settlement-list-filters.ts"
      - "lib/settlement-validation.ts"
      - "lib/settlement-validation.test.mjs"
      - "lib/settlement-list-filters.test.mjs"
      - "app/admin/settlements/page.tsx"
      - "app/admin/settlements/[id]/page.tsx"
      - "app/api/admin/settlements/[id]/review/route.ts"
      - "app/api/partner/settlements/route.ts"
      - "components/SettlementReview.tsx"
      - "package.json"
      - ".github/workflows/settlement-tests.yml"
  pull_request:
    paths:
      - "lib/settlement-list-filters.ts"
      - "lib/settlement-validation.ts"
      - "lib/settlement-validation.test.mjs"
      - "lib/settlement-list-filters.test.mjs"
      - "app/admin/settlements/page.tsx"
      - "package.json"
      - ".github/workflows/settlement-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:settlements
      - run: npm run typecheck
