name: Settlement tests
on:
  push:
    branches: [main]
    paths:
      - "lib/settlement-list-filters.ts"
      - "lib/settlement-validation.ts"
      - "lib/settlement-validation.test.mjs"
      - "lib/settlement-concurrency.test.mjs"
      - "lib/settlement-list-filters.test.mjs"
      - "app/admin/settlements/page.tsx"
      - "app/admin/settlements/[id]/page.tsx"
      - "app/api/admin/settlements/[id]/review/route.ts"
      - "app/api/partner/settlements/route.ts"
      - "components/SettlementReview.tsx"
      - "package.json"
      - ".github/workflows/settlement-tests.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/settlement-list-filters.ts"
      - "lib/settlement-validation.ts"
      - "lib/settlement-validation.test.mjs"
      - "lib/settlement-concurrency.test.mjs"
      - "lib/settlement-list-filters.test.mjs"
      - "app/admin/settlements/page.tsx"
      - "app/admin/settlements/[id]/page.tsx"
      - "app/api/admin/settlements/[id]/review/route.ts"
      - "app/api/partner/settlements/route.ts"
      - "components/SettlementReview.tsx"
      - "package.json"
      - ".github/workflows/settlement-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: settlement_test
          POSTGRES_PASSWORD: settlement_test_password
          POSTGRES_DB: settlement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement_test -d settlement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:settlements
      - name: PostgreSQL concurrency and rollback tests
        run: npm run test:settlement-concurrency
        env:
          SETTLEMENT_TEST_DATABASE_URL: postgresql://settlement_test:settlement_test_password@localhost:5432/settlement_ci
          SETTLEMENT_TEST_DB_CONFIRM: disposable
      - run: npm run typecheck
